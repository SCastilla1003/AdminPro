<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"

        activePage   = '',
        content      = ~{::main-content}

<head></head>
<body>
<th:block th:fragment="main-content">

  <div class="flex flex-col items-center justify-center py-24 text-center">

</th:block>
