<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(
        pageTitle    = 'Organigrama',
        pageSubtitle = 'Lista de usuarios registrados',
        activePage   = 'organigrama',
        content      = ~{::organigrama-content}
      )}">
<head></head>
<body>
<div th:fragment="organigrama-content">

    <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8 min-h-[600px] overflow-auto custom-scrollbar">
        
        <div class="mb-10 text-center">
            <h2 class="text-2xl font-black text-slate-800 mb-2">Directorio de Usuarios</h2>
            <p class="text-slate-400 font-medium">Visualización de usuarios del sistema</p>
        </div>

        <!-- Users List Structure -->
        <div class="flex flex-wrap gap-6 justify-center">
            
            <div th:each="user : ${users}" class="relative p-5 bg-white border border-slate-100 rounded-3xl shadow-sm text-center w-56 group hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                <div class="w-16 h-16 bg-slate-50 rounded-2xl mx-auto mb-3 flex items-center justify-center text-slate-400 group-hover:bg-blue-50 group-hover:text-blue-600 transition-colors overflow-hidden">
                    <img th:if="${user.profilePhoto}" th:src="@{'/uploads/' + ${user.profilePhoto}}" class="w-full h-full object-cover" alt="Foto perfil">
                    <svg th:unless="${user.profilePhoto}" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div th:text="${user.fullName}" class="font-bold text-slate-800 text-sm">Nombre Usuario</div>
                <div th:text="${user.jobTitle}" class="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1">Cargo</div>
            </div>

            <!-- If no users -->
            <div th:if="${users.empty}" class="w-full py-20 text-center">
                <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                </div>
                <p class="text-slate-400 font-medium">No hay usuarios registrados en el sistema.</p>
            </div>
        </div>

    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>

</div>
</body>
</html>
