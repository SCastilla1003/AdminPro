<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(
        pageTitle    = 'Organigrama',
        pageSubtitle = 'Estructura interactiva de la empresa',
        activePage   = 'organigrama',
        content      = ~{::organigrama-content}
      )}">
<head></head>
<body>
<div th:fragment="organigrama-content" style="height: 720px; display: flex; flex-direction: column; overflow: hidden; border-radius: 1.5rem; border: 1px solid #e2e8f0;">

    <style>
        .grid-bg {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .grid-bg {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>

    <div id="orgchart-app" th:data-can-edit="${canEdit}" style="display: flex; height: 100%; width: 100%; overflow: hidden; background: white;">
        
        <!-- SIDEBAR DE EDICIÓN -->
        <div th:if="${canEdit}" style="width: 320px; min-width: 320px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; background: #f8fafc; padding: 1.5rem;">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: #1e293b;">Panel de Edición</h3>
            
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <button onclick="addCustomNode()" style="flex: 1; padding: 0.5rem; background: #2563eb; color: white; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;">+ Nota</button>
                <button onclick="clearCanvas()" style="flex: 1; padding: 0.5rem; background: #ef4444; color: white; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600;">Limpiar</button>
            </div>

            <input type="text" oninput="filterUsers(this.value)" placeholder="Buscar usuario..." style="width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.85rem;">

            <div id="draggable-users-list" style="flex: 1; overflow-y: auto;" class="custom-scrollbar">
                <div th:each="user : ${users}"
                     th:attr="data-id=${user.id}, data-name=${user.fullName}, data-job=${user.jobTitle}, data-photo=${user.profilePhoto}"
                     draggable="true"
                     ondragstart="onUserDragStart(event, this)"
                     style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; margin-bottom: 0.5rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.75rem; cursor: grab;">
                    <div style="width: 40px; height: 40px; border-radius: 0.5rem; background: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;">
                        <img th:if="${user.profilePhoto}" th:src="@{'/uploads/' + ${user.profilePhoto}}" style="width: 100%; height: 100%; object-fit: cover;">
                        <span th:unless="${user.profilePhoto}" style="font-size: 0.75rem; font-weight: 700;" th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${user.fullName}">Nombre</div>
                        <div style="font-size: 0.7rem; color: #64748b; text-transform: uppercase;" th:text="${user.jobTitle ?: 'Sin Cargo'}">Cargo</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CANVAS -->
        <div style="flex-grow: 1; position: relative; overflow: hidden; display: flex; flex-direction: column;">
            <div id="viewport" class="grid-bg" style="flex-grow: 1; position: relative; overflow: hidden; cursor: grab;" ondragover="allowDrop(event)" ondrop="onNodeDrop(event)">
                <div id="board" style="position: absolute; width: 4000px; height: 4000px; left: 0; top: 0; transform-origin: 0 0;">
                    <svg id="svg-layer" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;">
                        <defs>
                            <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8" />
                            </marker>
                        </defs>
                        <g id="connections-group"></g>
                        <path id="temp-line" d="" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" fill="none" style="display: none;" />
                    </svg>
                    <div id="labels-container" style="position: absolute; inset: 0; z-index: 20; pointer-events: none;"></div>
                    <div id="nodes-container" style="position: absolute; inset: 0; z-index: 30; pointer-events: none;"></div>
                </div>
            </div>
            
            <!-- Controles -->
            <div style="position: absolute; bottom: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 100;">
                <button onclick="adjustZoom(0.1)" style="padding: 0.5rem 1rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem;">+</button>
                <button onclick="adjustZoom(-0.1)" style="padding: 0.5rem 1rem; background: white; border: 1px solid #e2e8f0; border-radius: 0.5rem;">-</button>
                <button onclick="saveOrganigrama()" style="padding: 0.5rem 1rem; background: #2563eb; color: white; border-radius: 0.5rem;">Guardar</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // ... (Mantener la misma lógica de JS que tenías, asegurando que renderNode usa estilos inline)
        const nodeWidth = 240;
        const nodeHeight = 84;
        let nodes = [];
        let connections = [];
        let panX = 150;
        let panY = 100;
        let zoom = 1.0;
        let draggedNodeId = null;
        let isConnecting = false;
        let connectStartNodeId = null;

        // ... (Tu lógica de funciones load, renderNode, etc.)
        
        function renderNode(node) {
            const card = document.createElement('div');
            card.id = node.id;
            // ESTILOS INLINE PARA EL NODO
            card.style.cssText = `position: absolute; width: ${nodeWidth}px; height: ${nodeHeight}px; left: ${node.x}px; top: ${node.y}px; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; display: flex; align-items: center; padding: 0.75rem; pointer-events: auto; z-index: 30; cursor: grab;`;
            
            // ... (Resto de tu lógica renderNode)
            nodesContainer.appendChild(card);
        }
        
        // ... (El resto de tus funciones: loadOrganigramaData, renderConnections, etc.)
    </script>
</div>
</body>
</html>
