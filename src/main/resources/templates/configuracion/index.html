<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(
        pageTitle    = 'Configuración del Sistema',
        pageSubtitle = 'Ajustes generales de la plataforma',
        activePage   = 'configuracion',
        content      = ~{::config-content}
      )}">
<head></head>
<body>
<div th:fragment="config-content">

    <!-- Flash messages -->
    <div th:if="${successMsg}" class="mb-5 flex items-center gap-3 bg-green-50 border border-green-200 text-green-700 rounded-xl px-4 py-3 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span th:text="${successMsg}">Éxito</span>
    </div>
    <div th:if="${errorMsg}" class="mb-5 flex items-center gap-3 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
        <span th:text="${errorMsg}">Error</span>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">

        <!-- Configuración de Asistencia -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-teal-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900">Control de Asistencia</h2>
                    <p class="text-xs text-slate-400">Horarios, tolerancia y zona horaria</p>
                </div>
            </div>
            <form th:action="@{/configuracion/asistencia}" method="post" class="p-6 space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Hora de Apertura</label>
                        <input type="time" name="openTime" th:value="${attendanceSettings.openTime}"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Hora de Cierre</label>
                        <input type="time" name="closeTime" th:value="${attendanceSettings.closeTime}"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Tolerancia (minutos)</label>
                    <input type="number" name="gracePeriodMinutes" th:value="${attendanceSettings.gracePeriodMinutes}" min="0" max="60"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Zona Horaria</label>
                    <select name="timezone" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                        <option value="America/Bogota" th:selected="${attendanceSettings.timezone == 'America/Bogota'}">América/Bogotá (COT)</option>
                        <option value="America/Mexico_City" th:selected="${attendanceSettings.timezone == 'America/Mexico_City'}">América/Ciudad de México (CST)</option>
                        <option value="America/New_York" th:selected="${attendanceSettings.timezone == 'America/New_York'}">América/Nueva York (EST)</option>
                        <option value="Europe/Madrid" th:selected="${attendanceSettings.timezone == 'Europe/Madrid'}">Europa/Madrid (CET)</option>
                    </select>
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" name="restrictWeekends" id="restrictWeekends" value="true"
                           th:checked="${attendanceSettings.restrictWeekends}"
                           class="w-5 h-5 rounded-lg border-slate-300 text-blue-600 focus:ring-blue-400">
                    <label for="restrictWeekends" class="text-sm font-semibold text-slate-700">Restringir acceso los fines de semana</label>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-xl shadow-lg shadow-teal-500/20 transition-all text-sm">
                        Guardar Asistencia
                    </button>
                </div>
            </form>
        </div>

        <!-- Configuración de Nómina -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900">Configuración de Nómina</h2>
                    <p class="text-xs text-slate-400">SMMLV, auxilio y porcentajes de deducción</p>
                </div>
            </div>
            <form th:action="@{/configuracion/nomina}" method="post" class="p-6 space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">SMMLV (COP)</label>
                    <input type="number" name="smmlv" th:value="${payrollSettings.smmlv}" min="0" step="1000"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Auxilio de Transporte (COP)</label>
                    <input type="number" name="transportAllowance" th:value="${payrollSettings.transportAllowance}" min="0" step="1000"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Salud (%)</label>
                        <input type="number" name="healthPercentage" th:value="${payrollSettings.healthPercentage}" min="0" max="100" step="0.1"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Pensión (%)</label>
                        <input type="number" name="pensionPercentage" th:value="${payrollSettings.pensionPercentage}" min="0" max="100" step="0.1"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-sm font-medium text-slate-700">
                    </div>
                </div>
                <div class="flex justify-end pt-2">
                    <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/20 transition-all text-sm">
                        Guardar Nómina
                    </button>
                </div>
            </form>
        </div>

        <!-- Sonido de Notificación -->
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center">
                    <svg class="w-5 h-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M17.95 6.05a8 8 0 010 11.9M6.5 8.5H4a1 1 0 00-1 1v5a1 1 0 001 1h2.5l4 4V4.5l-4 4z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900">Sonido de Notificación</h2>
                    <p class="text-xs text-slate-400">Audio para mensajes del chat</p>
                </div>
            </div>
            <form th:action="@{/configuracion/audio}" method="post" enctype="multipart/form-data" class="p-6 space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div th:if="${audioUploaded}" class="flex items-center gap-2 text-sm text-green-600 bg-green-50 rounded-xl px-4 py-2">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    Audio actual: whatsapp.mp3
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Subir nuevo audio (MP3)</label>
                    <input type="file" name="file" accept="audio/mpeg,audio/mp3"
                           class="w-full text-sm text-slate-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 file:transition-all">
                </div>
                <div class="flex justify-between items-center pt-1">
                    <span class="text-xs text-slate-400">Formato: MP3. Máx 2 MB.</span>
                    <button type="submit" class="px-6 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-xl shadow-lg shadow-amber-500/20 transition-all text-sm">
                        Subir Audio
                    </button>
                </div>
            </form>
        </div>

    </div>

</div>
</body>
</html>
