<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña — AdminPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/output.css">
</head>
<body class="min-h-screen font-sans antialiased flex items-center justify-center bg-slate-50 px-6 py-12">

  <div class="w-full max-w-md">
    <div class="flex items-center gap-3 justify-center mb-8">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <span class="text-xl font-bold text-gradient">AdminPro</span>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/80 p-8 border border-slate-100">

      <!-- Success: email sent -->
      <div th:if="${emailSent}" class="text-center">
        <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-5">
          <svg class="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-black text-slate-900 mb-2">Correo enviado</h1>
        <p class="text-slate-500 text-sm mb-6">Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña.</p>
        <a href="/login" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-500/25 transition-all text-sm">
          Volver al Login
        </a>
      </div>

      <!-- Request form -->
      <div th:unless="${emailSent}">
        <div class="mb-8">
          <h1 class="text-2xl font-black text-slate-900 mb-1">Recuperar Contraseña</h1>
          <p class="text-slate-500 text-sm">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <div th:if="${errorMsg}" class="mb-5 flex items-center gap-3 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
          <span th:text="${errorMsg}">Error</span>
        </div>

        <form th:action="@{/recuperar-password}" method="post" class="space-y-5">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-400 focus:ring-3 focus:ring-blue-100 outline-none transition-all text-slate-900 placeholder-slate-400 text-sm"
                   placeholder="tu@correo.com">
          </div>

          <button type="submit"
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 transition-all duration-200 text-sm">
            Enviar Enlace de Recuperación
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
          <a href="/login" class="text-sm text-slate-400 hover:text-blue-600 transition-colors">← Volver al login</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
