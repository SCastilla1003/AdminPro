<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/dashboard :: layout(
        pageTitle    = 'Inventario y Stock',
        pageSubtitle = 'Control de productos, existencias y reportes PDF',
        activePage   = 'inventario',
        content      = ~{::inventory-content}
      )}">
<head></head>
<body>
<div th:fragment="inventory-content"
     x-data="{
       showModal: false,
       editingProduct: null,
       openEdit(btn) {
         this.editingProduct = {
           id:          btn.dataset.id          || null,
           name:        btn.dataset.name        || '',
           price:       btn.dataset.price       || '0',
           stock:       btn.dataset.stock       || '0',
           minStock:    btn.dataset.minstock    || '0',
           category:    btn.dataset.category    || '',
           description: btn.dataset.description || ''
         };
         this.showModal = true;
       }
     }">

  <!-- Flash message -->
  <div th:if="${successMsg}" class="mb-5 flex items-center gap-3 bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400 rounded-xl px-4 py-3 text-sm shadow-sm animate-fade-in">
    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
    </svg>
    <span th:text="${successMsg}">Éxito</span>
  </div>

  <!-- Header row -->
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
    <div class="flex items-center gap-4 w-full sm:w-auto">
        <div class="flex-1 sm:flex-none bg-white dark:bg-slate-800 px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between sm:justify-start gap-3 transition-colors">
            <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Total Productos:</span>
            <span class="text-lg font-black text-slate-800 dark:text-white" th:text="${products.size()}">0</span>
        </div>
        <div class="flex-1 sm:flex-none bg-white dark:bg-slate-800 px-5 py-2.5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between sm:justify-start gap-3 transition-colors">
            <span class="text-xs font-bold text-red-400 uppercase tracking-widest">Stock Bajo:</span>
            <span class="text-lg font-black text-red-500" th:text="${lowStockCount}">0</span>
        </div>
    </div>

    <div class="flex items-center gap-3 w-full sm:w-auto">
      <a href="/inventario/exportar" target="_blank" download="Inventario_AdminPro.pdf"
         class="flex-1 sm:flex-none bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold px-5 py-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 transition-all text-sm flex items-center justify-center gap-2 hover:scale-105">
        <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Exportar PDF
      </a>
      <button @click="editingProduct = null; showModal = true"
              class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-blue-500/20 transition-all text-sm flex items-center justify-center gap-2 hover:scale-105">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Añadir Producto
      </button>
    </div>
  </div>

  <!-- Products Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div th:each="product : ${products}"
         class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all overflow-hidden group">

      <!-- Product Header -->
      <div class="p-6">
        <div class="flex items-start justify-between mb-4">
          <div class="w-14 h-14 rounded-2xl bg-slate-50 dark:bg-slate-700/50 flex items-center justify-center text-slate-400 dark:text-slate-500 group-hover:bg-blue-50 dark:group-hover:bg-blue-900/30 group-hover:text-blue-500 transition-colors">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
            </svg>
          </div>
          <div class="flex flex-col items-end">
            <span th:text="${product.category}" class="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-slate-500 mb-1 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-lg">Categoría</span>
            <span th:text="'$' + ${#numbers.formatInteger(product.price, 1, 'POINT')}" class="text-lg font-black text-blue-600 dark:text-blue-400">$0</span>
          </div>
        </div>

        <h3 th:text="${product.name}" class="font-bold text-slate-800 dark:text-white text-lg mb-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">Nombre del Producto</h3>
        <p th:text="${product.description}" class="text-sm text-slate-400 dark:text-slate-500 line-clamp-2 mb-4">Descripción breve...</p>

        <!-- Stock Indicator -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-500 dark:text-slate-400">Stock Disponible</span>
            <span th:text="${product.stock} + ' unidades'"
                  th:class="${product.stock <= (product.minStock != null ? product.minStock : 0)} ? 'text-red-500 dark:text-red-400' : 'text-green-500 dark:text-green-400'"
                  class="text-xs font-black">0 unidades</span>
          </div>
          <div class="w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full transition-all duration-500"
                 th:style="'width: ' + (${product.stock > 100 ? 100 : product.stock}) + '%'"
                 th:classappend="${product.stock <= (product.minStock != null ? product.minStock : 0)} ? 'bg-red-500' : 'bg-green-500'"></div>
          </div>
        </div>
      </div>

      <!-- Actions: visible on hover -->
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity">
        <!-- Uses data-* attributes to safely pass data regardless of special characters -->
        <button type="button"
                @click="openEdit($el)"
                th:data-id="${product.id}"
                th:data-name="${product.name}"
                th:data-price="${#numbers.formatDecimal(product.price, 0, 'NONE', 0, 'NONE')}"
                th:data-stock="${product.stock}"
                th:data-minstock="${product.minStock}"
                th:data-category="${product.category}"
                th:data-description="${product.description}"
                class="text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 flex items-center gap-1.5 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Editar
        </button>
        <form th:action="@{/inventario/eliminar/{id}(id=${product.id})}" method="post" onsubmit="return confirm('¿Eliminar producto de forma permanente?');">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button type="submit" class="text-xs font-bold text-slate-400 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 flex items-center gap-1.5 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Eliminar
          </button>
        </form>
      </div>
    </div>

    <!-- Empty state -->
    <div th:if="${products.empty}" class="col-span-full py-20 bg-white dark:bg-slate-800 rounded-3xl border border-dashed border-slate-200 dark:border-slate-700 text-center transition-colors">
        <svg class="w-16 h-16 text-slate-200 dark:text-slate-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <p class="text-slate-400 dark:text-slate-500 font-medium">No hay productos en el inventario.</p>
        <button @click="editingProduct = null; showModal = true" class="mt-4 text-blue-600 dark:text-blue-400 font-bold hover:underline transition-colors">Añadir el primero</button>
    </div>
  </div>

  <!-- ===== MODAL: Producto ===== -->
  <div x-show="showModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" x-cloak>
    <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-100 dark:border-slate-700" @click.away="showModal = false">
        <form th:action="@{/inventario/guardar}" method="post" class="p-8 space-y-6">
            <!-- ID del producto (vacío si es nuevo) -->
            <input type="hidden" name="id" :value="editingProduct ? editingProduct.id : ''">

            <h3 class="text-xl font-bold text-slate-900 dark:text-white" x-text="editingProduct ? 'Editar Producto' : 'Nuevo Producto'"></h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Nombre del Producto</label>
                    <input type="text" name="name" :value="editingProduct ? editingProduct.name : ''" required
                           class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all font-medium text-slate-700 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Categoría</label>
                    <input type="text" name="category" :value="editingProduct ? editingProduct.category : ''" placeholder="Ej: Bebidas, Snack..."
                           class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all font-medium text-slate-700 dark:text-white">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Precio ($)</label>
                        <input type="number" name="price" :value="editingProduct ? Math.round(Number(editingProduct.price)) : ''" required min="0" step="1" placeholder="Ej: 50000"
                               class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all font-medium text-slate-700 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Stock</label>
                        <input type="number" name="stock" :value="editingProduct ? editingProduct.stock : ''" required min="0"
                               class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all font-medium text-slate-700 dark:text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Stock Mínimo (Alerta)</label>
                    <input type="number" name="minStock" :value="editingProduct ? editingProduct.minStock : ''" min="0" placeholder="Ej: 10"
                           class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all font-medium text-slate-700 dark:text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2">Descripción</label>
                    <textarea name="description" rows="2"
                              class="w-full px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:bg-white dark:focus:bg-slate-800 focus:border-blue-400 outline-none transition-all resize-none font-medium text-slate-700 dark:text-white"
                              x-text="editingProduct ? editingProduct.description : ''"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-700 mt-6">
                <button type="button" @click="showModal = false"
                        class="px-6 py-2.5 font-bold text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-xl transition-colors">Cancelar</button>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-2.5 rounded-xl shadow-lg shadow-blue-500/20 transition-all">Guardar Producto</button>
            </div>
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        </form>
    </div>
  </div>

  <style>
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
  </style>

</div>
</body>
</html>
