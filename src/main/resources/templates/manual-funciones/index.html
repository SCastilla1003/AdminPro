<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard :: layout(
        pageTitle    = 'Manual de Funciones',
        pageSubtitle = 'Descripción de funciones y requisitos por cargo',
        activePage   = 'manual-funciones',
        content      = ~{::mf-content}
      )}">
<head></head>
<body>
<div th:fragment="mf-content">

  <!-- Flash -->
  <div th:if="${successMsg}" class="mb-5 flex items-center gap-3 bg-green-50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400 rounded-xl px-4 py-3 text-sm shadow-sm">
    <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
    <span th:text="${successMsg}">Éxito</span>
  </div>

  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h2 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight">Manuales de Funciones</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" th:text="${manuals.size()} + ' cargo(s) documentado(s)'">0 cargos documentados</p>
    </div>
    <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/manual-funciones/nuevo"
       class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-blue-500/20 transition-all text-sm flex items-center gap-2 hover:scale-105">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      Nuevo Manual
    </a>
  </div>

  <!-- Empty state -->
  <div th:if="${manuals.empty}" class="py-24 bg-white dark:bg-slate-800 rounded-3xl border border-dashed border-slate-200 dark:border-slate-700 text-center">
    <div class="w-20 h-20 rounded-3xl bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center mx-auto mb-5">
      <svg class="w-10 h-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <p class="text-slate-500 dark:text-slate-400 font-semibold text-lg">No hay manuales de funciones aún.</p>
    <p class="text-slate-400 dark:text-slate-500 text-sm mt-1">Los manuales creados por el administrador aparecerán aquí.</p>
    <a sec:authorize="hasAuthority('ROLE_ADMIN')" href="/manual-funciones/nuevo"
       class="inline-flex items-center gap-2 mt-5 bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition-all">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      Crear el primero
    </a>
  </div>

  <!-- Grid de manuales -->
  <div th:if="${!manuals.empty}" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    <div th:each="manual : ${manuals}"
         class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all overflow-hidden group">

      <!-- Color strip by level -->
      <div class="h-1.5 w-full bg-gradient-to-r from-indigo-500 to-purple-600"></div>

      <div class="p-6">
        <!-- Badge nivel -->
        <div class="flex items-center justify-between mb-4">
          <span th:text="${manual.level != null ? manual.level : 'Sin nivel'}"
                class="text-[10px] font-black uppercase tracking-widest bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-3 py-1 rounded-full">
            Nivel
          </span>
          <span th:if="${manual.code != null}" th:text="'Código: ' + ${manual.code}"
                class="text-[10px] text-slate-400 dark:text-slate-500 font-mono">Código</span>
        </div>

        <!-- Título -->
        <h3 th:text="${manual.jobTitle}" class="text-lg font-black text-slate-800 dark:text-white mb-1 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors leading-tight">
          Denominación del Empleo
        </h3>

        <!-- Metadata -->
        <div class="space-y-1 mt-3 mb-5">
          <div th:if="${manual.department != null}" class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            <span th:text="${manual.department}">Dependencia</span>
          </div>
          <div th:if="${manual.regional != null}" class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            <span th:text="'Regional ' + ${manual.regional}">Regional</span>
          </div>
          <div th:if="${manual.grade != null}" class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
            <span th:text="'Grado ' + ${manual.grade}">Grado</span>
          </div>
        </div>

        <!-- Purpose preview -->
        <p th:if="${manual.mainPurpose != null}"
           th:text="${#strings.abbreviate(manual.mainPurpose, 120)}"
           class="text-xs text-slate-400 dark:text-slate-500 leading-relaxed line-clamp-3 border-t border-slate-100 dark:border-slate-700 pt-4">
          Propósito principal...
        </p>
      </div>

      <!-- Footer actions -->
      <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
        <a th:href="@{/manual-funciones/{id}(id=${manual.id})}"
           class="text-sm font-bold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 flex items-center gap-1.5 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Ver manual completo
        </a>
        <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="flex items-center gap-2">
          <a th:href="@{/manual-funciones/editar/{id}(id=${manual.id})}"
             class="text-xs font-bold text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Editar
          </a>
          <form th:action="@{/manual-funciones/eliminar/{id}(id=${manual.id})}" method="post"
                onsubmit="return confirm('¿Eliminar este manual de funciones?');">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="text-xs font-bold text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              Eliminar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
