spring.application.name=${SPRING_APPLICATION_NAME:adminpro}

# Server Port (Dynamic for Railway)
server.port=${PORT:8080}

# Database (MySQL)
# Railway injects MYSQLHOST, MYSQLPORT and MYSQLDATABASE automatically when services are linked.
# Locally, it defaults to localhost:3306/adminpro_new.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=true

# File Upload Settings (Multipart)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# App specific configurations
# Public URL for Microsoft Office Online Viewer y ONLYOFFICE (debe ser accesible por el Document Server)
preview.base-url=${PREVIEW_BASE_URL:http://localhost:25565}

# ONLYOFFICE Configuration
onlyoffice.document-server-url=${ONLYOFFICE_URL:https://onlinedocs.onlyoffice.com/}
onlyoffice.api-key=${ONLYOFFICE_API_KEY:}
# URL interna para el proxy sin redirects (Railway: servicio .railway.internal)
onlyoffice.internal-url=${ONLYOFFICE_INTERNAL_URL:}
# URL interna de AdminPro para que el Document Server descargue archivos
adminpro.internal-url=${ADMINPRO_INTERNAL_URL:http://localhost:8080}

# S3 Storage Configuration (Railway Storage Buckets)
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket=${BUCKET:adminpro-documents}
aws.s3.region=${REGION:us-east-1}
aws.s3.endpoint=${ENDPOINT:}
aws.s3.access-key=${ACCESS_KEY_ID:}
aws.s3.secret-key=${SECRET_ACCESS_KEY:}

# Upload base directory (used as S3 key prefix or local path)
upload.dir=${UPLOAD_DIR:documents/}
profiles.dir=${PROFILES_DIR:profiles/}

# Storage backend: "s3" or "local" (set STORAGE_BACKEND=s3 in Railway)
storage.backend=${STORAGE_BACKEND:local}