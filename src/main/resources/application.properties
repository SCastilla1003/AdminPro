spring.application.name=adminpro

# Servidor
server.port=${PORT:25565}

# Base de datos (override con env vars en Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/adminpro_new?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=true

# Subida de Archivos (Multipart)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# URL pública para Microsoft Office Online Viewer
preview.base-url=${PREVIEW_BASE_URL:http://localhost:25565}
