spring.application.name=adminpro

# ==========================================
# SERVIDOR (Puerto dinámico para Railway)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# BASE DE DATOS (MySQL)
# ==========================================
# Railway inyecta MYSQLHOST, MYSQLPORT y MYSQLDATABASE automáticamente al conectar los servicios.
# Si estás en local, usará por defecto 'localhost:3306/adminpro_new'.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:adminpro_new}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=${MYSQLUSER:root}
# Corregido: Se cambió MYSQL_ROOT_PASSWORD por MYSQLPASSWORD que es la que provee el plugin de Railway
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# THYMELEAF
# ==========================================
spring.thymeleaf.cache=true

# ==========================================
# SEGURIDAD Y CONFIGURACIÓN DE ARCHIVOS (Multipart)
# ==========================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# CONFIGURACIONES PROPIAS DE LA APP
# ==========================================
# URL pública para Microsoft Office Online Viewer
preview.base-url=${PREVIEW_BASE_URL:http://localhost:25565}